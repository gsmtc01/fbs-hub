name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update notice data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run parser and policy tests
        run: python3 -m unittest discover -s tests
      - name: Run Local AI prompt tests
        run: node --test tests/test_local_llm.mjs
      - name: Export public data
        run: python3 export_static.py
      - name: Validate public data policy
        run: python3 validate_data.py
      - name: Build public artifact
        run: python3 build_site.py
      - name: Verify deployment artifact
        run: python3 verify_deploy.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
