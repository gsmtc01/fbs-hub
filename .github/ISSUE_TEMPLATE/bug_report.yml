name: 버그 신고
description: 링크, 데이터, 화면 또는 로컬 AI의 문제를 알려 주세요.
title: "[버그] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        공개 이슈에 이름, 학번, 전화번호, 이메일 등 개인정보를 작성하지 마십시오.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 문제가 발생했는지 간단히 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 순서를 작성해 주세요.
      placeholder: |
        1. 공지 탭을 엽니다.
        2. 검색어를 입력합니다.
        3. 오류가 발생합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작과 실제 동작
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 관련 원문 URL
      description: 특정 공지의 문제라면 상명대학교 원문 URL을 입력해 주세요.
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: macOS 15, Chrome 140, WebGPU 사용
  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 확인
      options:
        - label: 신고 내용에 개인정보나 비공개 자료를 포함하지 않았습니다.
          required: true
